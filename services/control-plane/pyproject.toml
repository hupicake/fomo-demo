[project]
name = "fomo-control-plane"
version = "0.1.0"
description = "FastAPI control plane and durable four-role coding-agent worker for FOMO"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "fastapi>=0.115",
  "httpx>=0.27",
  "opensandbox==0.1.15",
  "pydantic>=2.8",
  "sqlalchemy[asyncio]>=2.0",
  "sse-starlette>=2.1",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# MetaGPT currently supports Python < 3.12. Keep its tested design anchor, not
# a floating PyPI release, so the optional integration is reproducible.
metagpt = ["metagpt @ git+https://github.com/FoundationAgents/MetaGPT.git@11cdf466d042aece04fc6cfd13b28e1a70341b1f"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[project.scripts]
fomo-api = "fomo.api.app:run"
fomo-worker = "fomo.worker.runner:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fomo"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
