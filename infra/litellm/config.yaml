model_list:
  - model_name: pm
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: pm-fallback
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY
      api_base: os.environ/OPENAI_API_BASE
      reasoning_effort: xhigh

  - model_name: architect
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: architect-fallback
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY
      api_base: os.environ/OPENAI_API_BASE
      reasoning_effort: xhigh

  - model_name: engineer
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY
      api_base: os.environ/OPENAI_API_BASE
      reasoning_effort: xhigh
  - model_name: engineer-fallback
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: reviewer
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: reviewer-fallback
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY
      api_base: os.environ/OPENAI_API_BASE
      reasoning_effort: xhigh

  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com
      thinking:
        type: disabled

  # Canonical Direct Pi catalog. Public profile ids map to these aliases; the
  # bridge still applies the per-profile context and thinking policy.
  - model_name: fomo-pi-gpt-5.6
    litellm_params:
      # The configured OpenAI-compatible upstream advertises this concrete id.
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAI_API_KEY
      api_base: os.environ/OPENAI_API_BASE
      # Codex speaks Responses, while this OpenAI-compatible upstream exposes
      # the model through Chat Completions. LiteLLM performs the translation.
      use_chat_completions_api: true

  - model_name: fomo-pi-gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY
      api_base: os.environ/OPENAI_API_BASE
      use_chat_completions_api: true

  - model_name: fomo-pi-deepseek-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com
      # Canonical profile thinking is selected per request. LiteLLM maps
      # reasoning_effort=none to disabled and other supported efforts to enabled.

  # Optional provider routes are normalized behind FOMO's Chat Completions
  # endpoint. Enabled profiles must pass the sandbox streaming tool-call canary
  # before a worker is started.
  - model_name: fomo-pi-grok-4.5
    litellm_params:
      # yieldsum exposes Grok through an OpenAI-compatible Chat Completions API.
      model: openai/grok-4.5
      api_key: os.environ/GROK_API_KEY
      api_base: https://sub.yieldsum.com/v1
    model_info:
      # Conservative accounting guardrail for run-scoped LiteLLM budgets.
      input_cost_per_token: 0.000004
      output_cost_per_token: 0.000012

  - model_name: fomo-pi-kimi-k2.7-code
    litellm_params:
      model: openai/kimi-k2.7-code
      api_key: os.environ/OPENCODE_API_KEY
      api_base: https://opencode.ai/zen/v1
    model_info:
      input_cost_per_token: 0.00000095
      output_cost_per_token: 0.000004

  - model_name: fomo-pi-gemini-3.6-flash
    litellm_params:
      # The Gemini adapter uses native generateContent/streamGenerateContent
      # paths and x-goog-api-key authentication required by OpenCode Zen.
      model: gemini/gemini-3.6-flash
      api_key: os.environ/OPENCODE_API_KEY
      api_base: https://opencode.ai/zen/v1
    model_info:
      input_cost_per_token: 0.0000015
      output_cost_per_token: 0.0000075

  - model_name: fomo-pi-gemini-3.1-pro
    litellm_params:
      model: gemini/gemini-3.1-pro
      api_key: os.environ/OPENCODE_API_KEY
      api_base: https://opencode.ai/zen/v1
    model_info:
      # Conservatively charge the documented >200K OpenCode Zen tier.
      input_cost_per_token: 0.000004
      output_cost_per_token: 0.000018

  # Compatibility aliases for persisted runs and the current bridge contract.
  - model_name: fomo-pi-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com
      thinking:
        type: enabled

  - model_name: fomo-pi-build
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY
      api_base: os.environ/OPENAI_API_BASE

router_settings:
  num_retries: 1
  fallbacks:
    - pm: [pm-fallback]
    - architect: [architect-fallback]
    - engineer: [engineer-fallback]
    - reviewer: [reviewer-fallback]

litellm_settings:
  drop_params: true
  request_timeout: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
